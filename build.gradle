apply plugin: 'idea'

idea.module.name = name

allprojects {
    group = 'cn.mythicland'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/repository/public/' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '-Xshare:off'
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion.set('')
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.mockito:mockito-core:5.12.0'
    }
}

project(':mythic-framework-core') {
    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        implementation 'it.unimi.dsi:fastutil:8.5.13'
        implementation 'com.google.code.gson:gson:2.11.0'
        implementation 'com.belerweb:pinyin4j:2.5.1'
        compileOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
        compileOnly 'org.yaml:snakeyaml:2.2'
        testImplementation 'org.yaml:snakeyaml:2.2'
        testImplementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    }

    tasks.named('jar') {
        archiveFileName = 'MythicFramework-Core.jar'
    }

    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-Core-sources.jar'
    }
}

project(':mythic-framework-bukkit') {
    apply from: rootProject.file('gradle/spigot-1.8.8.gradle')
    repositories {
        maven { url = 'https://repo.dmulloy2.net/nexus/repository/public/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
    // Compile newer platform adapters separately; the shared Bukkit API keeps its 1.8 baseline.
    sourceSets {
        legacy112 {
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
        }
    }
    dependencies {
        api project(':mythic-framework-core')
        implementation 'it.unimi.dsi:fastutil:8.5.13'
        compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        compileOnly files(spigot188Jar)
        compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
        compileOnly 'net.luckperms:api:5.4'
        // Keep the exact existing plugin SDK; its published POM pulls in unrelated modern NMS modules.
        compileOnly files(rootProject.file('libs/DecentHolograms-2.10.1.jar'))
        testImplementation 'net.luckperms:api:5.4'
        compileOnly 'io.netty:netty-transport:4.1.132.Final'
        testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        testImplementation files(spigot188Jar)
        legacy112CompileOnly 'com.destroystokyo.paper:paper-api:1.12.2-R0.1-20190714.184133-413'
    }
    tasks.named('compileLegacy112Java') {
        classpath = configurations.legacy112CompileClasspath + sourceSets.main.output + configurations.compileClasspath
    }
    configurations.apiElements.outgoing.variants.named('classes') {
        artifact(sourceSets.legacy112.output.classesDirs.singleFile) {
            type = 'java-classes-directory'
            builtBy tasks.named('compileLegacy112Java')
        }
    }
    tasks.named('jar') { from sourceSets.legacy112.output }
    tasks.named('sourcesJar') { from sourceSets.legacy112.allSource }

    tasks.named('compileJava') {
        dependsOn tasks.named('prepareSpigot188')
    }
    tasks.named('compileTestJava') {
        dependsOn tasks.named('prepareSpigot188')
    }

    tasks.named('jar') {
        archiveFileName = 'MythicFramework-Bukkit.jar'
    }

    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-Bukkit-sources.jar'
    }
}

project(':mythic-framework-world') {
    apply from: rootProject.file('gradle/spigot-1.8.8.gradle')
    dependencies {
        api project(':mythic-framework-bukkit')
        compileOnly files(spigot188Jar)
        testImplementation files(spigot188Jar)
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareSpigot188')
    }
    tasks.named('compileTestJava') {
        dependsOn tasks.named('prepareSpigot188')
    }
    tasks.named('jar') {
        archiveFileName = 'MythicFramework-World.jar'
    }
    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-World-sources.jar'
    }
}

project(':mythic-framework-database') {
    dependencies {
        api project(':mythic-framework-core')
        implementation 'com.zaxxer:HikariCP:4.0.3'
        implementation 'org.flywaydb:flyway-core:13.4.0'
        testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    }

    tasks.named('jar') {
        archiveFileName = 'MythicFramework-Database.jar'
    }

    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-Database-sources.jar'
    }
}
