apply plugin: 'idea'

idea.module.name = name

allprojects {
    group = 'cn.mythicland'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/repository/public/' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '-Xshare:off'
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion.set('')
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.mockito:mockito-core:5.12.0'
    }
}

project(':mythic-framework-core') {
    dependencies {
        api 'org.reflections:reflections:0.10.2'
        implementation 'it.unimi.dsi:fastutil:8.5.13'
        implementation 'com.google.code.gson:gson:2.11.0'
        implementation 'com.belerweb:pinyin4j:2.5.1'
        compileOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
        testImplementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    }

    tasks.named('jar') {
        archiveFileName = 'MythicFramework-Core.jar'
    }

    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-Core-sources.jar'
    }
}

project(':mythic-framework-bukkit') {
    apply from: rootProject.file('gradle/spigot-1.8.8.gradle')
    dependencies {
        api project(':mythic-framework-core')
        implementation 'it.unimi.dsi:fastutil:8.5.13'
        compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        compileOnly files(spigot188Jar)
        testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
        testImplementation files(spigot188Jar)
    }

    tasks.named('compileJava') {
        dependsOn tasks.named('prepareSpigot188')
    }
    tasks.named('compileTestJava') {
        dependsOn tasks.named('prepareSpigot188')
    }

    tasks.named('jar') {
        archiveFileName = 'MythicFramework-Bukkit.jar'
    }

    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-Bukkit-sources.jar'
    }
}

project(':mythic-framework-world') {
    apply from: rootProject.file('gradle/spigot-1.8.8.gradle')
    dependencies {
        api project(':mythic-framework-bukkit')
        compileOnly files(spigot188Jar)
        testImplementation files(spigot188Jar)
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareSpigot188')
    }
    tasks.named('compileTestJava') {
        dependsOn tasks.named('prepareSpigot188')
    }
    tasks.named('jar') {
        archiveFileName = 'MythicFramework-World.jar'
    }
    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-World-sources.jar'
    }
}

project(':mythic-framework-database') {
    dependencies {
        implementation 'com.zaxxer:HikariCP:4.0.3'
        implementation 'org.flywaydb:flyway-core:13.4.0'
        testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    }

    tasks.named('jar') {
        archiveFileName = 'MythicFramework-Database.jar'
    }

    tasks.named('sourcesJar') {
        archiveFileName = 'MythicFramework-Database-sources.jar'
    }
}
