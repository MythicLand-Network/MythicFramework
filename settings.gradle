pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MythicFramework'

include 'mythic-framework-core'
include 'mythic-framework-bukkit'

project(':mythic-framework-core').projectDir = file('core')
project(':mythic-framework-bukkit').projectDir = file('bukkit')

include 'mythic-framework-world'
project(':mythic-framework-world').projectDir = file('world')

include 'mythic-framework-database'
project(':mythic-framework-database').projectDir = file('database')
