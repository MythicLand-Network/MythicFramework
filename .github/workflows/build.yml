name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check build
      - run: |
          test -f core/build/libs/MythicFramework-Core.jar
          test -f bukkit/build/libs/MythicFramework-Bukkit.jar
          test -f world/build/libs/MythicFramework-World.jar
