import java.security.MessageDigest

ext.registerRuntimeLibraryManifest = {
    String taskName,
    Provider<Directory> generatedResources,
    String manifestPath,
    Map<String, Configuration> platformConfigurations ->
        sourceSets.main.resources.srcDir(generatedResources)
        tasks.register(taskName) {
            outputs.file(generatedResources.map { it.file(manifestPath) })
            doLast {
                def libraries = [:]
                platformConfigurations.each { platform, configuration ->
                    configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                        def id = artifact.moduleVersion.id
                        def coordinate = "${id.group}:${artifact.name}:${id.version}"
                        def entry = libraries.computeIfAbsent(coordinate) {
                            [artifact: artifact, platforms: new LinkedHashSet<String>()]
                        }
                        entry.platforms.add(platform)
                    }
                }

                def output = generatedResources.get().file(manifestPath).asFile
                output.parentFile.mkdirs()
                output.withWriter('UTF-8') { writer ->
                    def ordered = libraries.entrySet().sort { left, right -> left.key <=> right.key }
                    writer.println("library.count=${ordered.size()}")
                    ordered.eachWithIndex { item, index ->
                        def artifact = item.value.artifact
                        def file = artifact.file
                        def digest = MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
                        def id = artifact.moduleVersion.id
                        def path = "${id.group.replace('.', '/')}/${artifact.name}/${id.version}/${file.name}"
                        writer.println("library.${index}.coordinate=${item.key}")
                        writer.println("library.${index}.fileName=${file.name}")
                        writer.println("library.${index}.downloadUrls=https://repo.maven.apache.org/maven2/${path},https://repo1.maven.org/maven2/${path}")
                        writer.println("library.${index}.sha256=${digest}")
                        writer.println("library.${index}.platform=${item.value.platforms.join(',')}")
                    }
                }
            }
        }
}
