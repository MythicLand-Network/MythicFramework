import java.security.MessageDigest

if (project.ext.has('mythicFrameworkConventionsApplied')) return
project.ext.mythicFrameworkConventionsApplied = true

def mythicGroup = 'cn.mythicland'

if (configurations.findByName('firstPartyEmbedded') == null) {
    configurations.create('firstPartyEmbedded') {
        transitive = false
        canBeConsumed = false
        canBeResolved = true
    }
}
if (configurations.findByName('firstPartyRuntimeGraph') == null) {
    configurations.create('firstPartyRuntimeGraph') {
        canBeConsumed = false
        canBeResolved = true
    }
}

def syncFirstPartyRuntimeGraph = {
    def embedded = configurations.named('firstPartyEmbedded').get()
    def runtimeGraph = configurations.named('firstPartyRuntimeGraph').get()
    def existing = runtimeGraph.dependencies.collect { dependency ->
        [dependency.group, dependency.name, dependency.version].join(':')
    } as Set
    embedded.dependencies.each { dependency ->
        String key = [dependency.group, dependency.name, dependency.version].join(':')
        if (existing.add(key)) dependencies.add('firstPartyRuntimeGraph', dependency)
    }
}

def declareFirstParty = { Object notation ->
    if (configurations.findByName('compileOnly') != null) {
        dependencies.add('compileOnly', notation)
    }
    if (configurations.findByName('testImplementation') != null) {
        dependencies.add('testImplementation', notation)
    }
    dependencies.add('firstPartyEmbedded', notation)
    dependencies.add('firstPartyRuntimeGraph', notation)
    return notation
}

ext.firstParty = declareFirstParty
ext.firstPartyDependency = declareFirstParty
ext.addFirstPartyDependency = declareFirstParty
ext.syncFirstPartyRuntimeGraph = syncFirstPartyRuntimeGraph

def validateFirstParty = {
    syncFirstPartyRuntimeGraph()
    def artifacts = configurations.named('firstPartyEmbedded').get().resolvedConfiguration.resolvedArtifacts
    def invalid = artifacts.findAll { artifact ->
        artifact.moduleVersion.id.group != mythicGroup
                && !artifact.moduleVersion.id.group.startsWith("${mythicGroup}.")
    }
    if (!invalid.isEmpty()) {
        String coordinates = invalid.collect { artifact ->
            def id = artifact.moduleVersion.id
            "${id.group}:${id.name}:${id.version}"
        }.sort().join(', ')
        throw new GradleException("firstPartyEmbedded contains non-first-party dependencies: ${coordinates}")
    }
}

ext.registerFirstPartyValidation = { String taskName = 'validateFirstPartyEmbedded' ->
    def validation = tasks.register(taskName) {
        doLast validateFirstParty
    }
    tasks.matching { task -> task.name == 'check' || task.name == 'assemble' }.configureEach {
        dependsOn validation
    }
    validation
}

registerFirstPartyValidation()

ext.registerRuntimeLibraryManifest = {
    String taskName,
    Provider<Directory> generatedResources,
    String manifestPath,
    Map<String, Configuration> platformConfigurations ->
        sourceSets.main.resources.srcDir(generatedResources)
        tasks.register(taskName) {
            outputs.file(generatedResources.map { it.file(manifestPath) })
            doLast {
                syncFirstPartyRuntimeGraph()
                def libraries = [:]
                def addArtifacts = { Configuration configuration, Collection<String> platforms ->
                    configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                        def id = artifact.moduleVersion.id
                        if (id.group == mythicGroup || id.group.startsWith("${mythicGroup}.")) return
                        def coordinate = "${id.group}:${artifact.name}:${id.version}"
                        def entry = libraries.computeIfAbsent(coordinate) {
                            [artifact: artifact, platforms: new LinkedHashSet<String>()]
                        }
                        entry.platforms.addAll(platforms)
                    }
                }
                platformConfigurations.each { platform, configuration ->
                    addArtifacts(configuration, [platform])
                }
                def firstPartyRuntimeGraph = configurations.findByName('firstPartyRuntimeGraph')
                if (firstPartyRuntimeGraph != null && !platformConfigurations.isEmpty()) {
                    def firstPartyPlatforms = platformConfigurations.containsKey('common')
                            ? ['common']
                            : platformConfigurations.keySet()
                    addArtifacts(firstPartyRuntimeGraph, firstPartyPlatforms)
                }

                def output = generatedResources.get().file(manifestPath).asFile
                output.parentFile.mkdirs()
                output.withWriter('UTF-8') { writer ->
                    def ordered = libraries.entrySet().sort { left, right -> left.key <=> right.key }
                    writer.println("library.count=${ordered.size()}")
                    ordered.eachWithIndex { item, index ->
                        def artifact = item.value.artifact
                        def file = artifact.file
                        def digest = MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
                        def id = artifact.moduleVersion.id
                        def path = "${id.group.replace('.', '/')}/${artifact.name}/${id.version}/${file.name}"
                        writer.println("library.${index}.coordinate=${item.key}")
                        writer.println("library.${index}.fileName=${file.name}")
                        writer.println("library.${index}.downloadUrls=https://repo.maven.apache.org/maven2/${path},https://repo1.maven.org/maven2/${path}")
                        writer.println("library.${index}.sha256=${digest}")
                        writer.println("library.${index}.platform=${item.value.platforms.join(',')}")
                    }
                }
            }
        }
}
